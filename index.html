<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백암고 1-1 정애쌤의 분노 게이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            transition: background-color 0.5s ease;
        }

        /* 100% 폭발시 진동 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-3px, -3px) rotate(-1deg); }
            20% { transform: translate(3px, 3px) rotate(1deg); }
            30% { transform: translate(-4px, 2px) rotate(0.5deg); }
            40% { transform: translate(4px, -2px) rotate(-0.5deg); }
            50% { transform: translate(-2px, 4px) rotate(1deg); }
            60% { transform: translate(3px, -3px) rotate(-1deg); }
            70% { transform: translate(-3px, 1px) rotate(0.5deg); }
            80% { transform: translate(2px, -2px) rotate(-0.5deg); }
            90% { transform: translate(-1px, 2px) rotate(0deg); }
        }

        .exploding-shake {
            animation: shake 0.3s infinite ease-in-out;
        }

        /* 머리 뚜껑 열리는 애니메이션 */
        .hair-top-lid {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: top center;
        }

        .head-popped {
            transform: translateY(-28px) rotate(-18deg);
        }

        /* 연기 및 불꽃 애니메이션 */
        @keyframes steamRise {
            0% { opacity: 0; transform: translateY(0) scale(0.6); }
            50% { opacity: 0.9; }
            100% { opacity: 0; transform: translateY(-40px) scale(1.4); }
        }

        .steam-particle {
            animation: steamRise 1.2s infinite ease-out;
        }

        .steam-1 { animation-delay: 0s; }
        .steam-2 { animation-delay: 0.4s; }
        .steam-3 { animation-delay: 0.8s; }

        /* 게이지 진행바 트랜지션 */
        .gauge-bar-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease;
        }
    </style>
</head>
<body id="main-body" class="bg-slate-50 min-h-screen flex flex-col items-center justify-between p-4 text-slate-800">

    <!-- 상단 헤더 -->
    <header class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                <i class="fa-solid font-bold fa-school text-lg"></i>
            </div>
            <div>
                <span class="text-xs text-indigo-600 font-bold tracking-wider block">백암고등학교 1학년 1반</span>
                <h1 class="text-lg font-bold text-slate-800 leading-tight">정애쌤의 분노 게이지</h1>
            </div>
        </div>
        <button id="mode-toggle-btn" onclick="openLoginModal()" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center gap-1.5 border border-slate-200">
            <i class="fa-solid fa-user-gear"></i>
            <span id="mode-badge-text">선생님 모드</span>
        </button>
    </header>

    <!-- 메인 컨텐츠 카통 -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center">
        <div id="card-container" class="w-full bg-white rounded-3xl p-6 shadow-xl border border-slate-100 flex flex-col items-center relative overflow-hidden transition-all duration-500">
            
            <!-- 상단 모드 안내 칩 -->
            <div class="w-full flex justify-between items-center mb-3">
                <span id="live-indicator" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    실시간 상태
                </span>
                <span id="current-mode-label" class="text-xs text-slate-400 font-medium">학생 모드 (읽기 전용)</span>
            </div>

            <!-- 정애 선생님 SVG 일러스트 영역 -->
            <div id="character-wrapper" class="relative w-56 h-56 my-2 flex items-center justify-center">
                <!-- 폭발 시 연기/불꽃 효과 (100% 전용) -->
                <div id="explosion-effects" class="absolute -top-6 inset-x-0 flex justify-center items-center gap-3 opacity-0 pointer-events-none transition-opacity duration-300 z-10">
                    <span class="steam-particle steam-1 text-3xl">💨</span>
                    <span class="steam-particle steam-2 text-4xl">💥</span>
                    <span class="steam-particle steam-3 text-3xl">🔥</span>
                </div>

                <!-- 정애쌤 SVG 캐릭터 (제공 사진 스타일 반영: 갈색 웨이브 hair, 반묶음 번, 귀여운 이목구비) -->
                <svg id="teacher-svg" viewBox="0 0 200 200" class="w-full h-full drop-shadow-md overflow-visible">
                    <defs>
                        <radialGradient id="faceGradient" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#FFF3EB"/>
                            <stop offset="100%" stop-color="#FFE4D6"/>
                        </radialGradient>
                        <filter id="glow-angry" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- 뒷머리 (웨이브 풍성한 느낌) -->
                    <path d="M 40 90 Q 25 120 35 155 Q 50 175 70 165 Q 60 130 65 100 Z" fill="#6A4028"/>
                    <path d="M 160 90 Q 175 120 165 155 Q 150 175 130 165 Q 140 130 135 100 Z" fill="#6A4028"/>
                    <ellipse cx="100" cy="120" rx="68" ry="55" fill="#5A3520"/>

                    <!-- 얼굴 고개 -->
                    <ellipse cx="100" cy="115" rx="52" ry="46" fill="url(#faceGradient)"/>

                    <!-- 귀 -->
                    <circle cx="48" cy="118" r="10" fill="#FFE0D0"/>
                    <circle cx="152" cy="118" r="10" fill="#FFE0D0"/>

                    <!-- 볼터치 (기분에 따라 변화) -->
                    <ellipse id="blush-left" cx="70" cy="125" rx="8" ry="5" fill="#FF8A8A" opacity="0.6"/>
                    <ellipse id="blush-right" cx="130" cy="125" rx="8" ry="5" fill="#FF8A8A" opacity="0.6"/>

                    <!-- 이목구비 그룹 -->
                    <!-- 눈썹 -->
                    <path id="eyebrow-left" d="M 68 98 Q 78 94 88 98" stroke="#4A2810" stroke-width="3.5" stroke-linecap="round" fill="none"/>
                    <path id="eyebrow-right" d="M 112 98 Q 122 94 132 98" stroke="#4A2810" stroke-width="3.5" stroke-linecap="round" fill="none"/>

                    <!-- 눈 -->
                    <g id="eyes-happy">
                        <circle cx="78" cy="108" r="7" fill="#3D2314"/>
                        <circle cx="80" cy="106" r="2.5" fill="#FFFFFF"/>
                        <circle cx="122" cy="108" r="7" fill="#3D2314"/>
                        <circle cx="124" cy="106" r="2.5" fill="#FFFFFF"/>
                    </g>
                    
                    <!-- 화난 눈 / 찌푸린 눈 (기본 hidden) -->
                    <g id="eyes-angry" class="hidden">
                        <path d="M 70 106 L 86 112" stroke="#3D2314" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 130 106 L 114 112" stroke="#3D2314" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="78" cy="112" r="5" fill="#3D2314"/>
                        <circle cx="122" cy="112" r="5" fill="#3D2314"/>
                    </g>

                    <!-- 코 -->
                    <path d="M 100 112 Q 98 118 102 119" stroke="#E2A68C" stroke-width="2.5" stroke-linecap="round" fill="none"/>

                    <!-- 입 (다이내믹 변환) -->
                    <path id="mouth" d="M 85 128 Q 100 140 115 128" stroke="#D9534F" stroke-width="3.5" stroke-linecap="round" fill="none"/>

                    <!-- 앞머리 및 정수리 (뚜껑 열림 대상) -->
                    <g id="hair-top-group" class="hair-top-lid">
                        <!-- 반묶음 상단 미니 번(Bun) -->
                        <circle cx="125" cy="52" r="14" fill="#5A3520"/>
                        <circle cx="125" cy="52" r="11" fill="#6A4028"/>

                        <!-- 앞머리 가르마 곡선 -->
                        <path d="M 48 92 C 55 60 85 55 100 68 C 115 55 145 60 152 92 C 140 70 115 65 100 75 C 85 65 60 70 48 92 Z" fill="#6A4028"/>
                        <path d="M 60 88 Q 80 72 98 80 Q 75 70 60 88 Z" fill="#7B4B30"/>
                        <path d="M 140 88 Q 120 72 102 80 Q 125 70 140 88 Z" fill="#7B4B30"/>
                    </g>
                </svg>
            </div>

            <!-- 분노 게이지 퍼센트 수치 표시 -->
            <div class="text-center mt-1 mb-4">
                <div class="flex items-baseline justify-center gap-1">
                    <span id="gauge-percent-text" class="text-5xl font-extrabold tracking-tight text-slate-800">0</span>
                    <span class="text-2xl font-bold text-slate-500">%</span>
                </div>
                <!-- 멘트 박스 -->
                <div id="status-speech-bubble" class="mt-2 px-5 py-2.5 rounded-2xl bg-slate-100 text-slate-800 font-bold text-lg inline-block shadow-inner transition-all duration-300 border border-slate-200">
                    기분이 좋아요^_^
                </div>
            </div>

            <!-- 분노 게이지 프로그레스 바 -->
            <div class="w-full bg-slate-100 rounded-full h-6 p-1 border border-slate-200 shadow-inner relative mb-4">
                <div id="gauge-fill" class="gauge-bar-fill h-full rounded-full bg-emerald-400 flex items-center justify-end pr-2" style="width: 0%;">
                    <div class="w-2 h-2 rounded-full bg-white opacity-80 animate-ping"></div>
                </div>
            </div>

            <!-- 단계별 레벨 마커 안내 -->
            <div class="w-full flex justify-between text-[11px] text-slate-400 font-semibold px-1 mb-2">
                <span class="cursor-pointer hover:text-emerald-600" onclick="previewLevel(0)">0% 평온</span>
                <span class="cursor-pointer hover:text-blue-600" onclick="previewLevel(30)">30% 미소</span>
                <span class="cursor-pointer hover:text-yellow-600" onclick="previewLevel(50)">50% 보통</span>
                <span class="cursor-pointer hover:text-orange-600" onclick="previewLevel(70)">70% 경고</span>
                <span class="cursor-pointer hover:text-red-600" onclick="previewLevel(100)">100% 폭발</span>
            </div>

            <!-- 선생님 컨트롤 패널 (선생님 모드일 때만 보임) -->
            <div id="teacher-control-panel" class="w-full mt-2 pt-4 border-t border-slate-200 hidden">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-indigo-700 flex items-center gap-1">
                        <i class="fa-solid fa-sliders"></i> 선생님 설정 조작
                    </span>
                    <button onclick="switchMode('student')" class="text-xs text-slate-500 hover:text-slate-700 underline">
                        학생 모드로 변경
                    </button>
                </div>

                <!-- 슬라이더 컨트롤 -->
                <div class="mb-4">
                    <label for="gauge-slider" class="block text-xs text-slate-600 mb-1 font-medium">분노 게이지 슬라이더 조절</label>
                    <input type="range" id="gauge-slider" min="0" max="100" value="0" step="1" 
                           oninput="onSliderChange(this.value)"
                           class="w-full h-2.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                </div>

                <!-- 빠른 설정 버튼 모음 -->
                <div class="grid grid-cols-5 gap-1.5 mb-3">
                    <button onclick="setGaugeValue(0)" class="py-1.5 px-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-bold transition">0%</button>
                    <button onclick="setGaugeValue(30)" class="py-1.5 px-1 bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 rounded-lg text-xs font-bold transition">30%</button>
                    <button onclick="setGaugeValue(50)" class="py-1.5 px-1 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 rounded-lg text-xs font-bold transition">50%</button>
                    <button onclick="setGaugeValue(70)" class="py-1.5 px-1 bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 rounded-lg text-xs font-bold transition">70%</button>
                    <button onclick="setGaugeValue(100)" class="py-1.5 px-1 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-lg text-xs font-bold transition">100%</button>
                </div>

                <!-- 한 줄 공지 작성 -->
                <div>
                    <label class="block text-xs text-slate-600 mb-1 font-medium">오늘의 학급 전달사항 (선택)</label>
                    <div class="flex gap-2">
                        <input type="text" id="teacher-notice-input" placeholder="예: 오늘 야자 없는 날입니다!" class="flex-1 text-xs border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="saveNotice()" class="bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-xl hover:bg-indigo-700 transition">저장</button>
                    </div>
                </div>
            </div>

            <!-- 학급 한 줄 공지 및 응원 영역 (학생/공통) -->
            <div id="notice-box" class="w-full mt-4 bg-slate-50 border border-slate-200 rounded-2xl p-3 text-center text-xs text-slate-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-bullhorn text-indigo-500"></i>
                <span id="notice-text">오늘도 즐거운 1학년 1반 되세요!</span>
            </div>

            <!-- 학생용 응원 버튼 -->
            <div id="student-actions" class="w-full mt-3 flex justify-center">
                <button onclick="sendStudentHeart()" class="w-full py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold rounded-2xl text-xs transition flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-solid fa-heart text-rose-500"></i>
                    <span>정애쌤에게 착한 말/응원 보내기 (<span id="heart-count">12</span>)</span>
                </button>
            </div>

        </div>
    </main>

    <!-- 선생님 로그인 비밀번호 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 w-80 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-300" id="login-modal-card">
            <div class="text-center mb-4">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-base font-bold text-slate-800">정애 선생님 인증</h2>
                <p class="text-xs text-slate-500 mt-1">설정 변경을 위해 비밀번호를 입력해주세요.</p>
                <p class="text-[10px] text-indigo-500 mt-0.5">(초기 비밀번호: 1234)</p>
            </div>

            <form onsubmit="handleLoginSubmit(event)" class="space-y-3">
                <div>
                    <input type="password" id="password-input" maxlength="10" placeholder="비밀번호 입력" 
                           class="w-full text-center tracking-widest text-lg font-bold border border-slate-300 rounded-2xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div id="password-error" class="text-xs text-red-500 text-center font-semibold hidden">
                    비밀번호가 올바르지 않습니다!
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="closeLoginModal()" class="w-1/2 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition">취소</button>
                    <button type="submit" class="w-1/2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition">확인</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 하단 푸터 -->
    <footer class="mt-4 text-center text-xs text-slate-400">
        백암고등학교 1학년 1반 학급 홈페이지 &copy; 정애쌤 분노 게이지
    </footer>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global state
        window.currentGauge = 0;
        window.currentMode = 'student'; // 'student' or 'teacher'
        window.heartCount = 12;

        // Firebase Config Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'baekam-high-class1-1';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-key",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:123456"
        };

        let db = null;
        let auth = null;

        // Initialize Firebase
        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            // Auth Login
            const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            if (initialToken) {
                await signInWithCustomToken(auth, initialToken);
            } else {
                await signInAnonymously(auth);
            }

            // Realtime Sync Firestore Document
            const gaugeDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'gaugeState', 'current');

            onSnapshot(gaugeDocRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (data.gauge !== undefined) {
                        updateUI(data.gauge, data.notice);
                    }
                } else {
                    // Initial document creation
                    setDoc(gaugeDocRef, { gauge: 0, notice: "오늘도 즐거운 1학년 1반 되세요!" });
                }
            }, (error) => {
                console.log("Firestore offline/demo mode fallback:", error);
            });

            window.saveToFirestore = async (value, noticeText) => {
                if (!db || !auth.currentUser) return;
                try {
                    await setDoc(gaugeDocRef, {
                        gauge: parseInt(value),
                        notice: noticeText || document.getElementById('notice-text').innerText,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                } catch (e) {
                    console.error("Save error:", e);
                }
            };
        } catch (err) {
            console.log("Firebase init standard fallback active");
        }
    </script>

    <!-- Vanilla JS UI logic -->
    <script>
        const TEACHER_PIN = "1234"; // 선생님 인증 비밀번호

        // UI 갱신 메인 함수
        function updateUI(gaugeValue, noticeMessage) {
            window.currentGauge = parseInt(gaugeValue);
            const val = window.currentGauge;

            // 1. 퍼센트 텍스트 갱신
            document.getElementById('gauge-percent-text').innerText = val;
            document.getElementById('gauge-slider').value = val;

            // 2. 게이지 바 너비 & 색상
            const fillBar = document.getElementById('gauge-fill');
            fillBar.style.width = val + '%';

            // 3. 단계별 색상 및 메세지 정의 (요청된 필수 멘트 반영)
            const speechBubble = document.getElementById('status-speech-bubble');
            const mainBody = document.getElementById('main-body');
            const cardContainer = document.getElementById('card-container');
            const characterWrapper = document.getElementById('character-wrapper');
            const explosionEffects = document.getElementById('explosion-effects');
            const hairLid = document.getElementById('hair-top-group');

            // SVG 이목구비 요소
            const eyebrowsLeft = document.getElementById('eyebrow-left');
            const eyebrowsRight = document.getElementById('eyebrow-right');
            const eyesHappy = document.getElementById('eyes-happy');
            const eyesAngry = document.getElementById('eyes-angry');
            const mouth = document.getElementById('mouth');
            const blushLeft = document.getElementById('blush-left');
            const blushRight = document.getElementById('blush-right');

            // 초기화
            cardContainer.classList.remove('exploding-shake');
            explosionEffects.classList.add('opacity-0');
            hairLid.classList.remove('head-popped');
            eyesHappy.classList.remove('hidden');
            eyesAngry.classList.add('hidden');

            let bgColor = "bg-slate-50";
            let barColor = "bg-emerald-400";
            let statusText = "기분이 좋아요^_^";

            if (val === 0) {
                // 0%: 하얀색/맑은 파스텔, 웃는 표정, "기분이 좋아요^_^"
                bgColor = "bg-white";
                barColor = "bg-emerald-400";
                statusText = "기분이 좋아요^_^";

                eyebrowsLeft.setAttribute('d', 'M 68 98 Q 78 94 88 98');
                eyebrowsRight.setAttribute('d', 'M 112 98 Q 122 94 132 98');
                mouth.setAttribute('d', 'M 82 126 Q 100 142 118 126'); // 활짝 웃는 입
                blushLeft.setAttribute('opacity', '0.7');
                blushRight.setAttribute('opacity', '0.7');

            } else if (val > 0 && val <= 30) {
                // 30%: 약간의 미소 이모지, "괜찮아요^_^"
                bgColor = "bg-slate-50";
                barColor = "bg-sky-400";
                statusText = "괜찮아요^_^";

                eyebrowsLeft.setAttribute('d', 'M 68 97 Q 78 95 88 97');
                eyebrowsRight.setAttribute('d', 'M 112 97 Q 122 95 132 97');
                mouth.setAttribute('d', 'M 85 128 Q 100 136 115 128'); // 잔미소 입
                blushLeft.setAttribute('opacity', '0.5');
                blushRight.setAttribute('opacity', '0.5');

            } else if (val > 30 && val <= 50) {
                // 50%: 무표정 이모지, "아직 괜찮아요^_^"
                bgColor = "bg-amber-50/50";
                barColor = "bg-amber-400";
                statusText = "아직 괜찮아요^_^";

                eyebrowsLeft.setAttribute('d', 'M 68 97 L 88 97');
                eyebrowsRight.setAttribute('d', 'M 112 97 L 132 97');
                mouth.setAttribute('d', 'M 88 130 L 112 130'); // 일자 무표정
                blushLeft.setAttribute('opacity', '0.3');
                blushRight.setAttribute('opacity', '0.3');

            } else if (val > 50 && val <= 85) {
                // 70%: 눈썹 올라가고 화난 표정, "건들지마세요^_^"
                bgColor = "bg-orange-50";
                barColor = "bg-orange-500";
                statusText = "건들지마세요^_^";

                // 올려진 화난 눈썹 (\ / 형태)
                eyebrowsLeft.setAttribute('d', 'M 68 92 L 88 100');
                eyebrowsRight.setAttribute('d', 'M 112 100 L 132 92');
                mouth.setAttribute('d', 'M 86 134 Q 100 126 114 134'); // 삐친 뾰루퉁 입
                blushLeft.setAttribute('opacity', '0.1');
                blushRight.setAttribute('opacity', '0.1');

            } else {
                // 100%: 진한 빨간색, 뚜껑 열려서 폭발하는 이미지, "폭발하기 직전!!"
                bgColor = "bg-red-100";
                barColor = "bg-red-600";
                statusText = "폭발하기 직전!! (건들면 위험)";

                // 화난 이목구비 & 눈 변환
                eyebrowsLeft.setAttribute('d', 'M 68 90 L 88 102');
                eyebrowsRight.setAttribute('d', 'M 112 102 L 132 90');
                eyesHappy.classList.add('hidden');
                eyesAngry.classList.remove('hidden');
                mouth.setAttribute('d', 'M 82 138 Q 100 122 118 138'); // 크게 소리지르는 입

                // 뚜껑 열림 및 애니메이션 효과
                hairLid.classList.add('head-popped');
                explosionEffects.classList.remove('opacity-0');
                cardContainer.classList.add('exploding-shake');
            }

            // 배칭 스타일 적용
            speechBubble.innerText = statusText;
            fillBar.className = `gauge-bar-fill h-full rounded-full ${barColor} flex items-center justify-end pr-2`;
            mainBody.className = `${bgColor} min-h-screen flex flex-col items-center justify-between p-4 text-slate-800 transition-colors duration-500`;

            // 공지 업데이트
            if (noticeMessage) {
                document.getElementById('notice-text').innerText = noticeMessage;
                document.getElementById('teacher-notice-input').value = noticeMessage;
            }
        }

        // 프리뷰 연출 (마우스 오버나 클릭시)
        function previewLevel(val) {
            updateUI(val);
        }

        // 선생님 모드 진입 모달 관련
        function openLoginModal() {
            if (window.currentMode === 'teacher') {
                switchMode('student');
                return;
            }
            const modal = document.getElementById('login-modal');
            const card = document.getElementById('login-modal-card');
            document.getElementById('password-input').value = '';
            document.getElementById('password-error').classList.add('hidden');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
                document.getElementById('password-input').focus();
            }, 10);
        }

        function closeLoginModal() {
            const modal = document.getElementById('login-modal');
            const card = document.getElementById('login-modal-card');
            modal.classList.add('opacity-0');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const inputPin = document.getElementById('password-input').value;
            if (inputPin === TEACHER_PIN) {
                closeLoginModal();
                switchMode('teacher');
            } else {
                document.getElementById('password-error').classList.remove('hidden');
            }
        }

        // 모드 전환
        function switchMode(targetMode) {
            window.currentMode = targetMode;
            const badgeText = document.getElementById('mode-badge-text');
            const currentLabel = document.getElementById('current-mode-label');
            const teacherPanel = document.getElementById('teacher-control-panel');
            const toggleBtn = document.getElementById('mode-toggle-btn');

            if (targetMode === 'teacher') {
                badgeText.innerText = '학생 모드로 전환';
                currentLabel.innerText = '선생님 관리자 모드 활성화됨';
                currentLabel.className = "text-xs text-indigo-600 font-bold";
                teacherPanel.classList.remove('hidden');
                toggleBtn.className = "px-3 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 text-white transition flex items-center gap-1.5 shadow-md";
            } else {
                badgeText.innerText = '선생님 모드';
                currentLabel.innerText = '학생 모드 (읽기 전용)';
                currentLabel.className = "text-xs text-slate-400 font-medium";
                teacherPanel.classList.add('hidden');
                toggleBtn.className = "px-3 py-1.5 text-xs font-bold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center gap-1.5 border border-slate-200";
            }
        }

        // 슬라이더 및 빠른 버튼 동작
        function onSliderChange(val) {
            updateUI(val);
            if (window.saveToFirestore) {
                window.saveToFirestore(val);
            }
        }

        function setGaugeValue(val) {
            document.getElementById('gauge-slider').value = val;
            updateUI(val);
            if (window.saveToFirestore) {
                window.saveToFirestore(val);
            }
        }

        function saveNotice() {
            const noticeVal = document.getElementById('teacher-notice-input').value;
            if (!noticeVal.trim()) return;
            document.getElementById('notice-text').innerText = noticeVal;
            if (window.saveToFirestore) {
                window.saveToFirestore(window.currentGauge, noticeVal);
            }
        }

        // 학생 응원 하트 기능
        function sendStudentHeart() {
            window.heartCount++;
            document.getElementById('heart-count').innerText = window.heartCount;

            // 하트 퐁퐁 효과
            const btn = event.currentTarget;
            const pop = document.createElement('span');
            pop.innerText = '❤️ +1';
            pop.className = 'absolute -top-6 text-sm font-bold text-rose-500 animate-bounce';
            btn.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }

        // 초기 화면 로드
        window.onload = () => {
            updateUI(0, "오늘도 즐거운 1학년 1반 되세요!");
        };
    </script>
</body>
</html>
